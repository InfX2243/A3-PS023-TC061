name: Go CI

on:
  push:
    branches:
      - main
      - feat/aws-ec2-worker-provisioning
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Format, test, and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format Go sources
        run: gofmt -w $(git ls-files '*.go')
      - name: Run unit and integration tests
        run: go test ./...
      - name: Run static analysis
        run: go vet ./...
